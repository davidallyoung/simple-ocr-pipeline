[project]
name = "simple-ocr-pipeline"
version = "0.1.0"
description = "On-premise OCR pipeline with an interactive rich TUI"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "pymupdf>=1.24",
    "rich>=13.7",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "liteparse>=2.14.0",
    "flask>=3.1.3",
    "textual>=0.86",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# PyTorch CUDA build on Windows comes from the PyTorch index, not PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "app"]
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
